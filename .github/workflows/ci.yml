name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ci
      PUBLIC_APP_URL: https://vexen.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Unit tests
        working-directory: backend
        run: python -m pytest -n 0 -q
      - name: Start the server
        working-directory: backend
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)" API_KEY_PEPPER="$(openssl rand -hex 16)"
          nohup uvicorn server:app --port 8000 > ../server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null && exit 0
            sleep 1
          done
          cat ../server.log
          exit 1
      - name: Smoke test against the running server
        run: python tests/smoke_e2e.py
        env:
          VEXEN_BASE: http://127.0.0.1:8000
          VEXEN_EXPECT_PUBLIC_URL: https://vexen.example.test
      - name: Server log
        if: always()
        run: cat server.log

  frontend:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build (warnings fail the build)
        run: yarn build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
      - name: No third-party tracking scripts are shipped
        run: "! grep -r -l -i -E 'emergent|posthog' build"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vexen:ci .
      - name: Start a database and the app
        run: |
          docker network create vexen-ci
          docker run -d --name mongo --network vexen-ci mongo:7
          docker run -d --name vexen --network vexen-ci --restart on-failure:5 -p 8080:10000 \
            -e MONGO_URL=mongodb://mongo:27017 -e DB_NAME=ci \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e API_KEY_PEPPER="$(openssl rand -hex 16)" \
            -e PUBLIC_APP_URL=https://vexen.example.test \
            vexen:ci
      - name: Wait until it answers
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 2
          done
          docker logs vexen
          exit 1
      - name: Check the website and the API in the container
        run: |
          base=http://127.0.0.1:8080
          has() { case "$1" in *"$2"*) ;; *) echo "expected $2 in: $1" >&2; return 1 ;; esac; }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          has "$(curl -fsS "$base/api/ready")" '"database":"ok"'
          has "$(curl -fsS "$base/")" 'id="root"'
          has "$(curl -fsS "$base/approve/abc.def")" 'id="root"'
          test "$(status "$base/api/does-not-exist")" = 404
          test "$(status "$base/static/js/missing.js")" = 404
          test "$(status "$base/docs/vexen-cap-table.pdf")" = 404
          test "$(status "$base/api/download/cap-table")" = 404
          test "$(status -H 'Range: bytes=0-99' "$base/demo/vexen-demo.mp4")" = 206
          curl -fsS "$base/sdk/vexen.py" | cmp - sdk/python/vexen.py
      - name: Smoke test against the container
        run: |
          python3 -m pip install requests
          VEXEN_EXPECT_PUBLIC_URL=https://vexen.example.test VEXEN_BASE=http://127.0.0.1:8080 python3 tests/smoke_e2e.py
      - name: Container log
        if: always()
        run: docker logs vexen
